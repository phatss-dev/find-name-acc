<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool Lọc Tài Khoản TXT</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --border: #334155;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --btn-copy: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 24px;
            display: flex;
            justify-content: center;
        }
        .container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 20px; }
        .header { text-align: center; margin-bottom: 8px; }
        .header h1 { font-size: 24px; color: var(--accent); }
        .header p { color: var(--text-muted); font-size: 14px; margin-top: 4px; }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }
        .card h2 { font-size: 16px; margin-bottom: 12px; color: var(--text); display: flex; align-items: center; gap: 8px; }
        textarea {
            width: 100%;
            height: 130px;
            background: #0b1120;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            padding: 12px;
            font-family: monospace;
            font-size: 13px;
            resize: vertical;
        }
        textarea:focus { outline: none; border-color: var(--accent); }
        .upload-options { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
        .file-label {
            background: #334155;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }
        .file-label:hover { background: #475569; }
        input[type="file"] { display: none; }
        .file-status { font-size: 13px; color: var(--text-muted); }
        .actions { display: flex; gap: 12px; }
        button {
            flex: 1;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-run { background: var(--accent); color: #0f172a; }
        .btn-run:hover { background: var(--accent-hover); }
        .btn-copy { background: var(--btn-copy); color: white; flex: 0 0 140px; }
        .btn-copy:hover { opacity: 0.9; }
        pre {
            background: #0b1120;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            color: #38df8b;
            font-family: monospace;
            font-size: 13px;
            white-space: pre-wrap;
            min-height: 140px;
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Account File Finder</h1>
        <p>Tìm kiếm vị trí account trong các file txt cực nhanh</p>
    </div>

    <!-- Bước 1: Nhập danh sách acc -->
    <div class="card">
        <h2>1. Nhập danh sách acc cần tìm (nội dung find.txt)</h2>
        <textarea id="findInput" placeholder="clone1:mật khẩu:cookie&#10;clone2:pass&#10;clone3/mật khẩu"></textarea>
    </div>

    <!-- Bước 2: Tải các file cần quét -->
    <div class="card">
        <h2>2. Chọn file hoặc thư mục cần quét (acc cần find)</h2>
        <div class="upload-options">
            <label class="file-label">
                📂 Chọn cả thư mục
                <input type="file" id="folderInput" webkitdirectory directory multiple>
            </label>
            <label class="file-label">
                📄 Chọn nhiều file .txt
                <input type="file" id="filesInput" multiple accept=".txt">
            </label>
        </div>
        <div class="file-status" id="fileCount">Chưa có file nào được nạp.</div>
    </div>

    <!-- Nút chạy -->
    <div class="actions">
        <button class="btn-run" onclick="processSearch()">🚀 Bắt Đầu Lọc</button>
        <button class="btn-copy" onclick="copyResult()">📋 Copy Kết Quả</button>
    </div>

    <!-- Bước 3: Kết quả -->
    <div class="card">
        <h2>3. Kết quả tìm kiếm</h2>
        <pre id="outputResult">Kết quả sẽ xuất hiện ở đây sau khi bấm nút Lọc...</pre>
    </div>
</div>

<script>
    let selectedFiles = [];

    // Lắng nghe sự kiện chọn file/folder
    document.getElementById('folderInput').addEventListener('change', (e) => handleFiles(e.target.files));
    document.getElementById('filesInput').addEventListener('change', (e) => handleFiles(e.target.files));

    function handleFiles(files) {
        // Chỉ lấy các file .txt hoặc file không có đuôi thư mục
        selectedFiles = Array.from(files).filter(f => f.name.endsWith('.txt') || !f.name.includes('.'));
        document.getElementById('fileCount').textContent = `Đã nạp ${selectedFiles.length} file sẵn sàng quét.`;
    }

    function extractUsername(line) {
        line = line.trim();
        if (!line) return null;
        const parts = line.split(/[:/|]/);
        return parts[0].trim();
    }

    async function processSearch() {
        const rawInput = document.getElementById("findInput").value;
        const outputEl = document.getElementById("outputResult");

        if (!rawInput.trim()) {
            alert("Vui lòng dán danh sách account cần tìm!");
            return;
        }
        if (selectedFiles.length === 0) {
            alert("Vui lòng chọn ít nhất 1 file hoặc 1 thư mục chứa file txt!");
            return;
        }

        // Tách lấy danh sách username duy nhất
        const targetAccounts = [...new Set(
            rawInput.split("\n")
                .map(extractUsername)
                .filter(Boolean)
        )];

        const fileToAccounts = {};
        const foundAccounts = new Set();

        // Đọc từng file
        for (const file of selectedFiles) {
            const content = await file.text();
            
            targetAccounts.forEach(acc => {
                // Regex chuẩn: khớp đầu dòng/ký tự xuống dòng, theo sau là delimiter hoặc khoảng trắng
                const escaped = acc.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const regex = new RegExp(`(^|[\\r\\n])${escaped}(?=[:/|\\s]|$)`, 'i');
                
                if (regex.test(content)) {
                    if (!fileToAccounts[file.name]) fileToAccounts[file.name] = [];
                    fileToAccounts[file.name].push(acc);
                    foundAccounts.add(acc);
                }
            });
        }

        // Format kết quả in ra
        let resultText = "--- KẾT QUẢ TÌM KIẾM ---\n\n";
        const fileNames = Object.keys(fileToAccounts);

        if (fileNames.length > 0) {
            fileNames.forEach(filename => {
                const accs = fileToAccounts[filename];
                if (accs.length === 1) {
                    resultText += `${filename} có ${accs[0]}\n`;
                } else {
                    const indent = " ".repeat(filename.length + 4);
                    resultText += `${filename} có ${accs[0]},\n`;
                    for (let i = 1; i < accs.length - 1; i++) {
                        resultText += `${indent}${accs[i]},\n`;
                    }
                    resultText += `${indent}${accs[accs.length - 1]}\n`;
                }
            });
        } else {
            resultText += "Không tìm thấy tài khoản nào khớp trong các file.\n";
        }

        const missing = targetAccounts.filter(acc => !foundAccounts.has(acc));
        if (missing.length > 0) {
            resultText += "\n--- KHÔNG TÌM THẤY TRONG FILE NÀO ---\n";
            missing.forEach(acc => resultText += `- ${acc}\n`);
        }

        outputEl.textContent = resultText;
    }

    function copyResult() {
        const text = document.getElementById("outputResult").textContent;
        navigator.clipboard.writeText(text).then(() => {
            alert("Đã sao chép kết quả!");
        });
    }
</script>
</body>
</html>
