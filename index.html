<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool Lọc Tài Khoản TXT</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --border: #334155;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --btn-copy: #10b981;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 24px;
            display: flex;
            justify-content: center;
        }
        .container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 20px; }
        .header { text-align: center; margin-bottom: 8px; }
        .header h1 { font-size: 24px; color: var(--accent); }
        .header p { color: var(--text-muted); font-size: 14px; margin-top: 4px; }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }
        .card h2 { font-size: 16px; margin-bottom: 12px; color: var(--text); }
        textarea {
            width: 100%;
            height: 130px;
            background: #0b1120;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            padding: 12px;
            font-family: monospace;
            font-size: 13px;
            resize: vertical;
        }
        textarea:focus { outline: none; border-color: var(--accent); }
        
        /* Vùng kéo thả */
        .drop-zone {
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 24px;
            text-align: center;
            background: #0b1120;
            cursor: pointer;
            transition: 0.2s;
        }
        .drop-zone.dragover {
            border-color: var(--accent);
            background: rgba(56, 189, 248, 0.05);
        }
        .drop-zone p { font-size: 14px; color: var(--text-muted); margin-bottom: 12px; }
        .btn-select {
            background: #334155;
            color: var(--text);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            display: inline-block;
        }
        .btn-select:hover { background: #475569; }
        input[type="file"] { display: none; }

        /* Danh sách file */
        .file-status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            font-size: 13px;
        }
        .file-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
            max-height: 100px;
            overflow-y: auto;
        }
        .chip {
            background: #334155;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-family: monospace;
            color: var(--accent);
        }
        .btn-clear {
            background: transparent;
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }
        .btn-clear:hover { background: var(--danger); color: white; }

        .actions { display: flex; gap: 12px; }
        button.main-btn {
            flex: 1;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-run { background: var(--accent); color: #0f172a; }
        .btn-run:hover { background: var(--accent-hover); }
        .btn-copy { background: var(--btn-copy); color: white; flex: 0 0 140px; }
        .btn-copy:hover { opacity: 0.9; }
        
        pre {
            background: #0b1120;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            color: #38df8b;
            font-family: monospace;
            font-size: 13px;
            white-space: pre-wrap;
            min-height: 140px;
            max-height: 450px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Account File Finder</h1>
        <p>Tìm kiếm vị trí account trong các file txt cực nhanh</p>
    </div>

    <!-- Bước 1 -->
    <div class="card">
        <h2>1. Nhập danh sách acc cần tìm (nội dung find.txt)</h2>
        <textarea id="findInput" placeholder="clone1:mật khẩu:cookie&#10;clone2:pass&#10;clone3/mật khẩu"></textarea>
    </div>

    <!-- Bước 2 -->
    <div class="card">
        <h2>2. Nạp các file TXT cần quét</h2>
        <div class="drop-zone" id="dropZone">
            <p>Kéo thả trực tiếp nhiều file hoặc folder vào đây</p>
            <label class="btn-select">
                📂 Chọn nhiều file từ máy tính
                <input type="file" id="filesInput" multiple>
            </label>
        </div>

        <div class="file-status-bar">
            <span id="fileCountText">Đã nạp: 0 file</span>
            <button class="btn-clear" id="btnClear" onclick="clearFiles()" style="display: none;">Xóa tất cả file</button>
        </div>
        <div class="file-chips" id="fileChips"></div>
    </div>

    <!-- Nút xử lý -->
    <div class="actions">
        <button class="main-btn btn-run" onclick="processSearch()">🚀 Bắt Đầu Lọc</button>
        <button class="main-btn btn-copy" onclick="copyResult()">📋 Copy Kết Quả</button>
    </div>

    <!-- Bước 3 -->
    <div class="card">
        <h2>3. Kết quả tìm kiếm</h2>
        <pre id="outputResult">Kết quả sẽ xuất hiện ở đây sau khi bấm nút Lọc...</pre>
    </div>
</div>

<script>
    // Lưu trữ file dưới dạng Map để tránh trùng tên file khi chọn nhiều đợt
    const fileMap = new Map();

    const dropZone = document.getElementById('dropZone');
    const filesInput = document.getElementById('filesInput');
    const fileCountText = document.getElementById('fileCountText');
    const fileChips = document.getElementById('fileChips');
    const btnClear = document.getElementById('btnClear');

    // Xử lý kéo thả Drag & Drop
    ['dragenter', 'dragover'].forEach(name => {
        dropZone.addEventListener(name, (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
    });

    ['dragleave', 'drop'].forEach(name => {
        dropZone.addEventListener(name, (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
        });
    });

    dropZone.addEventListener('drop', (e) => {
        const files = e.dataTransfer.files;
        addFilesToList(files);
    });

    filesInput.addEventListener('change', (e) => {
        addFilesToList(e.target.files);
        // Reset input để có thể chọn tiếp cùng 1 file nếu muốn
        filesInput.value = '';
    });

    function addFilesToList(files) {
        for (const file of files) {
            // Lấy tất cả các file (ưu tiên .txt hoặc file dữ liệu văn bản)
            fileMap.set(file.name, file);
        }
        updateUI();
    }

    function clearFiles() {
        fileMap.clear();
        updateUI();
    }

    function updateUI() {
        const count = fileMap.size;
        fileCountText.textContent = `Đã nạp: ${count} file`;
        btnClear.style.display = count > 0 ? 'inline-block' : 'none';
        
        fileChips.innerHTML = '';
        fileMap.forEach((_, name) => {
            const chip = document.createElement('span');
            chip.className = 'chip';
            chip.textContent = name;
            fileChips.appendChild(chip);
        });
    }

    function extractUsername(line) {
        line = line.trim();
        if (!line) return null;
        const parts = line.split(/[:/|]/);
        return parts[0].trim();
    }

    async function processSearch() {
        const rawInput = document.getElementById("findInput").value;
        const outputEl = document.getElementById("outputResult");

        if (!rawInput.trim()) {
            alert("Vui lòng dán danh sách account cần tìm!");
            return;
        }
        if (fileMap.size === 0) {
            alert("Vui lòng chọn ít nhất 1 file .txt!");
            return;
        }

        const targetAccounts = [...new Set(
            rawInput.split("\n")
                .map(extractUsername)
                .filter(Boolean)
        )];

        const fileToAccounts = {};
        const foundAccounts = new Set();

        // Quét từng file trong Map
        for (const [filename, file] of fileMap.entries()) {
            const content = await file.text();
            
            targetAccounts.forEach(acc => {
                const escaped = acc.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const regex = new RegExp(`(^|[\\r\\n])${escaped}(?=[:/|\\s]|$)`, 'i');
                
                if (regex.test(content)) {
                    if (!fileToAccounts[filename]) fileToAccounts[filename] = [];
                    fileToAccounts[filename].push(acc);
                    foundAccounts.add(acc);
                }
            });
        }

        // Format kết quả
        let resultText = "--- KẾT QUẢ TÌM KIẾM ---\n\n";
        const fileNames = Object.keys(fileToAccounts);

        if (fileNames.length > 0) {
            fileNames.forEach(filename => {
                const accs = fileToAccounts[filename];
                if (accs.length === 1) {
                    resultText += `${filename} có ${accs[0]}\n`;
                } else {
                    const indent = " ".repeat(filename.length + 4);
                    resultText += `${filename} có ${accs[0]},\n`;
                    for (let i = 1; i < accs.length - 1; i++) {
                        resultText += `${indent}${accs[i]},\n`;
                    }
                    resultText += `${indent}${accs[accs.length - 1]}\n`;
                }
            });
        } else {
            resultText += "Không tìm thấy tài khoản nào khớp trong các file đã chọn.\n";
        }

        const missing = targetAccounts.filter(acc => !foundAccounts.has(acc));
        if (missing.length > 0) {
            resultText += "\n--- KHÔNG TÌM THẤY TRONG FILE NÀO ---\n";
            missing.forEach(acc => resultText += `- ${acc}\n`);
        }

        outputEl.textContent = resultText;
    }

    function copyResult() {
        const text = document.getElementById("outputResult").textContent;
        navigator.clipboard.writeText(text).then(() => {
            alert("Đã sao chép kết quả vào bộ nhớ tạm!");
        });
    }
</script>
</body>
</html>
