<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool Lọc Dữ Liệu Acc TXT</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --border: #334155;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --btn-copy: #10b981;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 24px;
            display: flex;
            justify-content: center;
        }
        .container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 20px; }
        .header { text-align: center; margin-bottom: 8px; }
        .header h1 { font-size: 24px; color: var(--accent); }
        .header p { color: var(--text-muted); font-size: 14px; margin-top: 4px; }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }
        .card h2 { font-size: 16px; margin-bottom: 12px; color: var(--text); }
        textarea {
            width: 100%;
            height: 130px;
            background: #0b1120;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            padding: 12px;
            font-family: monospace;
            font-size: 13px;
            resize: vertical;
        }
        textarea:focus { outline: none; border-color: var(--accent); }
        
        .drop-zone {
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 24px;
            text-align: center;
            background: #0b1120;
            cursor: pointer;
            transition: 0.2s;
        }
        .drop-zone.dragover {
            border-color: var(--accent);
            background: rgba(56, 189, 248, 0.05);
        }
        .drop-zone p { font-size: 14px; color: var(--text-muted); margin-bottom: 12px; }
        .btn-select {
            background: #334155;
            color: var(--text);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            display: inline-block;
        }
        .btn-select:hover { background: #475569; }
        input[type="file"] { display: none; }

        .file-status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            font-size: 13px;
        }
        .file-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
            max-height: 100px;
            overflow-y: auto;
        }
        .chip {
            background: #334155;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-family: monospace;
            color: var(--accent);
        }
        .btn-clear {
            background: transparent;
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }
        .btn-clear:hover { background: var(--danger); color: white; }

        .actions { display: flex; gap: 12px; }
        button.main-btn {
            flex: 1;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-run { background: var(--accent); color: #0f172a; }
        .btn-run:hover { background: var(--accent-hover); }
        .btn-copy { background: var(--btn-copy); color: white; flex: 0 0 140px; }
        .btn-copy:hover { opacity: 0.9; }
        
        pre {
            background: #0b1120;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            color: #38df8b;
            font-family: monospace;
            font-size: 13px;
            white-space: pre-wrap;
            min-height: 140px;
            max-height: 500px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Account Data Finder</h1>
        <p>Lọc trích xuất đầy đủ định dạng (User:Pass:Cookie) theo danh sách tài khoản</p>
    </div>

    <!-- Bước 1 -->
    <div class="card">
        <h2>1. Nhập danh sách acc cần tìm</h2>
        <textarea id="findInput" placeholder="clone1&#10;clone2:pass_cu:cookie_cu&#10;clone3"></textarea>
    </div>

    <!-- Bước 2 -->
    <div class="card">
        <h2>2. Nạp các file TXT cần quét</h2>
        <div class="drop-zone" id="dropZone">
            <p>Kéo thả trực tiếp nhiều file vào đây</p>
            <label class="btn-select">
                📂 Chọn các file TXT
                <input type="file" id="filesInput" multiple>
            </label>
        </div>

        <div class="file-status-bar">
            <span id="fileCountText">Đã nạp: 0 file</span>
            <button class="btn-clear" id="btnClear" onclick="clearFiles()" style="display: none;">Xóa tất cả file</button>
        </div>
        <div class="file-chips" id="fileChips"></div>
    </div>

    <!-- Nút thao tác -->
    <div class="actions">
        <button class="main-btn btn-run" onclick="processSearch()">🚀 Bắt Đầu Lọc</button>
        <button class="main-btn btn-copy" onclick="copyResult()">📋 Copy Kết Quả</button>
    </div>

    <!-- Bước 3 -->
    <div class="card">
        <h2>3. Kết quả chi tiết</h2>
        <pre id="outputResult">Kết quả sẽ xuất hiện ở đây sau khi bấm nút Lọc...</pre>
    </div>
</div>

<script>
    const fileMap = new Map();
    const dropZone = document.getElementById('dropZone');
    const filesInput = document.getElementById('filesInput');
    const fileCountText = document.getElementById('fileCountText');
    const fileChips = document.getElementById('fileChips');
    const btnClear = document.getElementById('btnClear');

    // Drag & drop handlers
    ['dragenter', 'dragover'].forEach(name => {
        dropZone.addEventListener(name, (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
    });

    ['dragleave', 'drop'].forEach(name => {
        dropZone.addEventListener(name, (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
        });
    });

    dropZone.addEventListener('drop', (e) => {
        addFilesToList(e.dataTransfer.files);
    });

    filesInput.addEventListener('change', (e) => {
        addFilesToList(e.target.files);
        filesInput.value = '';
    });

    function addFilesToList(files) {
        for (const file of files) {
            fileMap.set(file.name, file);
        }
        updateUI();
    }

    function clearFiles() {
        fileMap.clear();
        updateUI();
    }

    function updateUI() {
        const count = fileMap.size;
        fileCountText.textContent = `Đã nạp: ${count} file`;
        btnClear.style.display = count > 0 ? 'inline-block' : 'none';
        
        fileChips.innerHTML = '';
        fileMap.forEach((_, name) => {
            const chip = document.createElement('span');
            chip.className = 'chip';
            chip.textContent = name;
            fileChips.appendChild(chip);
        });
    }

    function extractUsername(line) {
        line = line.trim();
        if (!line) return null;
        const parts = line.split(/[:/|]/);
        return parts[0].trim();
    }

    async function processSearch() {
        const rawInput = document.getElementById("findInput").value;
        const outputEl = document.getElementById("outputResult");

        if (!rawInput.trim()) {
            alert("Vui lòng dán danh sách account cần tìm!");
            return;
        }
        if (fileMap.size === 0) {
            alert("Vui lòng nạp ít nhất 1 file dữ liệu!");
            return;
        }

        // Tách lấy danh sách username duy nhất (chỉ lấy phần tên acc)
        const targetAccounts = [...new Set(
            rawInput.split("\n")
                .map(extractUsername)
                .filter(Boolean)
        )];

        // Map lưu: { "tên_file.txt": ["clone1:pass1:cookie1", "clone2:pass2:cookie2"] }
        const fileToLines = {};
        const foundAccounts = new Set();

        // Duyệt từng file
        for (const [filename, file] of fileMap.entries()) {
            const text = await file.text();
            const lines = text.split(/\r?\n/);

            lines.forEach(line => {
                const trimmedLine = line.trim();
                if (!trimmedLine) return;

                const lineUser = extractUsername(trimmedLine);
                if (!lineUser) return;

                // Kiểm tra tên acc trong dòng có nằm trong danh sách cần tìm không (không phân biệt hoa thường)
                const isMatch = targetAccounts.some(target => target.toLowerCase() === lineUser.toLowerCase());
                
                if (isMatch) {
                    if (!fileToLines[filename]) fileToLines[filename] = [];
                    fileToLines[filename].push(trimmedLine);
                    foundAccounts.add(lineUser.toLowerCase());
                }
            });
        }

        // Tạo nội dung hiển thị
        let resultText = "--- KẾT QUẢ TÌM KIẾM (TRÍCH XUẤT ĐẦY ĐỦ DATA) ---\n\n";
        const fileNames = Object.keys(fileToLines);

        if (fileNames.length > 0) {
            fileNames.forEach(filename => {
                const lines = fileToLines[filename];
                resultText += `[+] File: ${filename} (Tìm thấy ${lines.length} acc)\n`;
                lines.forEach(item => {
                    resultText += `    ${item}\n`;
                });
                resultText += `\n`;
            });
        } else {
            resultText += "Không tìm thấy tài khoản nào khớp trong các file đã nạp.\n";
        }

        const missing = targetAccounts.filter(acc => !foundAccounts.has(acc.toLowerCase()));
        if (missing.length > 0) {
            resultText += "--- KHÔNG TÌM THẤY TRONG FILE NÀO ---\n";
            missing.forEach(acc => resultText += `- ${acc}\n`);
        }

        outputEl.textContent = resultText;
    }

    function copyResult() {
        const text = document.getElementById("outputResult").textContent;
        navigator.clipboard.writeText(text).then(() => {
            alert("Đã sao chép toàn bộ kết quả vào bộ nhớ tạm!");
        });
    }
</script>
</body>
</html>
